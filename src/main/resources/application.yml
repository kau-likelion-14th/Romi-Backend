spring:
  config:
    import:optional:file.env[.properties]
  profiles:
    active: local

  servlet:
    multipart:
      enable: true
      max-file-size: 50MB
      max-request-size: 50MB



---
# local profile
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialghect